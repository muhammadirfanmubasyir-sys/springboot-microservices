services:
  postgres-order:
    container_name: postgres-order
    image: postgres
    pull_policy: missing
    environment:
      POSTGRES_DB: order-service
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      PG_DATA: /data/postgres
    volumes:
      - ./postgres-order:/data/postgres
    expose:
      - "5431"
    ports:
      - "5431:5431"
    command: -p 5431
    restart: always
  postgres-product:
    container_name: postgres-product
    image: postgres
    pull_policy: missing
    environment:
      POSTGRES_DB: product-service
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      PG_DATA: /data/postgres
    volumes:
      - ./postgres-product:/data/postgres
    ports:
      - "5433:5433"
    command: -p 5433
    restart: always
  postgres-inventory:
    container_name: postgres-inventory
    image: postgres
    pull_policy: missing
    environment:
      POSTGRES_DB: inventory-service
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      PG_DATA: /data/postgres
    volumes:
      - ./postgres-inventory:/data/postgres
    ports:
      - "5434:5434"
    command: -p 5434
    restart: always
  keycloak-mysql:
    container_name: keycloak-mysql
    image: mysql:5.7
    pull_policy: missing
    volumes:
      - ./mysql_keycloak_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.5.4
    pull_policy: missing
    command: ["start-dev", "--import-realm"]
    environment:
      DB_VENDOR: MYSQL
      DB_ADDR: keycloak-mysql
      DB_DATABASE: keycloak
      DB_USER: admin
      DB_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./realms/:/opt/keycloak/data/import/
    depends_on:
      - keycloak-mysql
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    pull_policy: missing
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    pull_policy: missing
    container_name: kafka-ui
    ports:
      - "9090:8080"
    depends_on:
      - broker
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
  discovery-server:
    image: irfanmubasyir96/discovery-server:latest
    container_name: discovery-server
    pull_policy: missing
    ports:
      - "8762:8762"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - grafana-lgtm
  api-gateway:
    image: irfanmubasyir96/api-gateway:latest
    container_name: api-gateway
    pull_policy: missing
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
    depends_on:
      - discovery-server
      - keycloak
      - grafana-lgtm
  order-service:
    container_name: order-service
    image: irfanmubasyir96/order-service:latest
    pull_policy: missing
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-order:5431/order-service
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=broker:29092
    depends_on:
      - postgres-order
      - postgres-product
      - product-service
      - broker
      - discovery-server
      - api-gateway
  product-service:
    container_name: product-service
    image: irfanmubasyir96/product-service:latest
    pull_policy: missing
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-product:5433/product-service
    depends_on:
      - postgres-product
      - discovery-server
      - api-gateway
      - grafana-lgtm
  inventory-service:
    container_name: inventory-service
    image: irfanmubasyir96/inventory-service:latest
    pull_policy: missing
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-inventory:5434/inventory-service
    depends_on:
      - postgres-inventory
      - discovery-server
      - api-gateway
      - grafana-lgtm
  notification-service:
    container_name: notification-service
    image: irfanmubasyir96/notification-service:latest
    pull_policy: missing
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=broker:29092
    depends_on:
      - broker
      - discovery-server
      - api-gateway
      - grafana-lgtm
  grafana-lgtm:
    container_name: grafana-lgtm
    image: 'grafana/otel-lgtm:latest'
    pull_policy: missing
    volumes:
      # Mount the named volume to Grafana's data directory
      - ./grafana/data:/var/lib/grafana
      - ./grafana/conf:/etc/grafana
      - ./grafana/log:/var/log/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - '3000:3000'
      - '4317:4317'
      - '4318:4318'
