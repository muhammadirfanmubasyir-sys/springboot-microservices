spring.application.name=inventory-service

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres-inventory:5434/inventory-service
spring.datasource.username=admin
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8082

eureka.client.service-url.defaultZone=http://discovery-server:8762/eureka
eureka.instance.prefer-ip-address=true

#Kafka properties
spring.kafka.bootstrap-servers=broker:29092
spring.kafka.consumer.group-id=inventory-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.type.mapping=orderCreated:com.irfan.microservices.inventory.event.OrderCreatedEvent,inventoryReserved:com.irfan.microservices.inventory.event.InventoryReservedEvent,inventoryFailed:com.irfan.microservices.inventory.event.InventoryFailedEvent

management.otlp.metrics.export.url=http://grafana-lgtm:4318/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=http:/grafana-lgtm:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://grafana-lgtm:4318/v1/logs
management.tracing.sampling.probability=1.0

logging.level.com.irfan=INFO
logging.level.org.springframework.boot.actuator.autoconfigure.opentelemetry=INFO
logging.level.org.springframework.boot.docker.compose=INFO
