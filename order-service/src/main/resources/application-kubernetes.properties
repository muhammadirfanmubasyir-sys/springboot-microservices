spring.application.name=order-service

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres-order.demo-ns.svc.cluster.local:5431/order-service
spring.datasource.username=admin
spring.datasource.password=password

server.port=8085

eureka.client.service-url.defaultZone=http://discovery-server.demo-ns.svc.cluster.local:8762/eureka
eureka.instance.prefer-ip-address=true

#Kafka properties
spring.kafka.bootstrap-servers=broker.demo-ns.svc.cluster.local:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=orderCreated:com.irfan.microservices.order.event.OrderCreatedEvent,inventoryReserved:com.irfan.microservices.order.event.InventoryReservedEvent,inventoryFailed:com.irfan.microservices.order.event.InventoryFailedEvent,orderCompleted:com.irfan.microservices.order.event.OrderCompletedEvent,orderCancelled:com.irfan.microservices.order.event.OrderCancelledEvent

#otel properties
management.otlp.metrics.export.url=http://grafana-lgtm.demo-ns.svc.cluster.local:4318/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=http://grafana-lgtm.demo-ns.svc.cluster.local:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://grafana-lgtm.demo-ns.svc.cluster.local:4318/v1/logs
management.tracing.sampling.probability=1.0

logging.level.com.irfan=INFO
logging.level.org.springframework.boot.actuator.autoconfigure.opentelemetry=INFO
logging.level.org.springframework.boot.docker.compose=INFO
